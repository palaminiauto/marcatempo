<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcatempo</title>
  
  <!-- Collegamento alla Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; max-width: 400px; margin: auto; background-color: #f0f0f0; }
    .nav { display: flex; gap: 10px; margin-bottom: 25px; }
    .nav button { flex: 1; padding: 10px; cursor: pointer; border: none; border-radius: 8px; background: #bbb; font-weight: bold; color: white; transition: 0.2s; }
    .nav button.active { background: #444; }
    
    .btn { padding: 18px; font-size: 20px; margin: 10px 0; width: 100%; cursor: pointer; border: none; border-radius: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px #ccc; }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px #ccc; }
    .btn-inizio { background: #5CB85C; color: white; }
    .btn-fine { background: #D9534F; color: white; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    th, td { border-bottom: 1px solid #ddd; padding: 12px 6px; text-align: left; font-size: 13px; }
    th { background: #eaeaea; text-transform: uppercase; font-size: 11px; color: #555; }
    
    .hidden { display: none; }
    #status { text-align: center; margin-top: 20px; font-weight: bold; color: #555; background: #e0e0e0; padding: 10px; border-radius: 8px; }
    #loading { text-align: center; color: #777; font-style: italic; }
  </style>
</head>
<body>

  <!-- Menu di navigazione -->
  <div class="nav">
    <button id="btn-tab-timbra" class="active" onclick="showView('timbratura')">Timbra</button>
    <button id="btn-tab-storico" onclick="showView('storico'); loadStorico()">Storico</button>
  </div>

  <!-- Schermata 1: Pulsanti -->
  <div id="timbratura">
    <button class="btn btn-inizio" onclick="timbra('inizio')">INIZIO</button>
    <button class="btn btn-fine" onclick="timbra('fine')">FINE</button>
    <p id="status">In attesa...</p>
  </div>

  <!-- Schermata 2: Storico -->
  <div id="storico" class="hidden">
    <p id="loading">Caricamento in corso...</p>
    <table>
      <thead>
        <tr><th>Data</th><th>Inizio</th><th>Fine</th><th>Lavoro</th></tr>
      </thead>
      <tbody id="tabella-dati"></tbody>
    </table>
  </div>

  <script>
    // --- ATTENZIONE: INCOLLA QUI IL TUO URL DI GOOGLE APPS SCRIPT ---
    // Deve essere racchiuso tra virgolette singole, senza spazi.
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwa5yn3ZU3nT1ECYxPoQuFDqAmPZPW-GAYBhNiK5nlVSCT3sAeQOjpLlT-kcNqHr4QDhg/exec'; 

    function showView(viewName) {
      document.getElementById('timbratura').classList.add('hidden');
      document.getElementById('storico').classList.add('hidden');
      document.getElementById('btn-tab-timbra').classList.remove('active');
      document.getElementById('btn-tab-storico').classList.remove('active');
      
      document.getElementById(viewName).classList.remove('hidden');
      
      if (viewName === 'timbratura') {
        document.getElementById('btn-tab-timbra').classList.add('active');
      } else {
        document.getElementById('btn-tab-storico').classList.add('active');
      }
    }

    function timbra(tipo) {
      const lavorazione = prompt("Descrizione del lavoro:");
      if (lavorazione === null) return;

      const now = new Date();
      const dataStr = now.toLocaleDateString('it-IT');
      const oraStr = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

      if (tipo === 'inizio') {
        localStorage.setItem('marcatempo_inizio_palamini', JSON.stringify({ data: dataStr, ora: oraStr }));
        document.getElementById('status').innerText = "🟢 Registrato inizio alle " + oraStr;
      } 
      else if (tipo === 'fine') {
        const inizioSalvato = JSON.parse(localStorage.getItem('marcatempo_inizio_palamini'));
        if (!inizioSalvato) {
          alert("Errore: Clicca prima INIZIO!");
          return;
        }

        document.getElementById('status').innerText = "⏳ Invio dati in corso...";

        const url = `${SCRIPT_URL}?action=save&data=${encodeURIComponent(inizioSalvato.data)}&oraInizio=${encodeURIComponent(inizioSalvato.ora)}&oraFine=${encodeURIComponent(oraStr)}&lavorazione=${encodeURIComponent(lavorazione)}`;

        fetch(url, { method: 'GET', mode: 'cors' })
          .then(response => response.json())
          .then(data => {
            if (data.status === "ok") {
                document.getElementById('status').innerText = "✅ Salvato con successo alle " + oraStr;
                localStorage.removeItem('marcatempo_inizio_palamini');
            } else {
                document.getElementById('status').innerText = "❌ Errore del server.";
            }
          })
          .catch(error => {
            document.getElementById('status').innerText = "❌ Errore di connessione.";
          });
      }
    }

    function loadStorico() {
      document.getElementById('loading').style.display = 'block';
      const tbody = document.getElementById('tabella-dati');
      tbody.innerHTML = '';
      
      fetch(`${SCRIPT_URL}?action=get`, { method: 'GET', mode: 'cors' })
        .then(res => res.json())
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          data.forEach(row => {
            if (row[0] && row[0] !== "Data") { // Salta intestazione extra
                tbody.innerHTML += `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`;
            }
          });
        })
        .catch(error => {
          document.getElementById('loading').innerText = "❌ Impossibile caricare lo storico.";
        });
    }
  </script>
</body>
</html>
